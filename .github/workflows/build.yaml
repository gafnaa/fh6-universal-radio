name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    name: Dashboard tests and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dashboard tooling
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint JavaScript and CSS
        run: npm run lint
      - name: Run dashboard tests
        run: npm test -- --reporter=dot

  windows-build:
    name: Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build distribution into dist/
        run: .\scripts\build.ps1
      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: fh6-universal-radio
          path: dist/
